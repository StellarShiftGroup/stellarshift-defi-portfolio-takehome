# Pull published sidecar images from Docker Hub (no local build).
# Images published on Docker Hub: stellarshift/*
name: stellarshift-portfolio-takehome

services:
  chain-health-probe:
    image: stellarshift/chain-health-probe:1.0.0
    pull_policy: always
    ports:
      - "8081:8080"
    environment:
      DEFAULT_RPC_URL: https://eth.llamarpc.com
      PROBE_TIMEOUT_MS: "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  contract-metadata-api:
    image: stellarshift/contract-metadata-api:1.0.0
    pull_policy: always
    ports:
      - "8082:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  indexer-bootstrap:
    image: stellarshift/indexer-bootstrap:1.0.0
    pull_policy: always
    environment:
      INDEXER_DATA_DIR: /data/indexer
    volumes:
      - ./data/indexer:/data/indexer
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - init

  portfolio-snapshot-worker:
    image: stellarshift/portfolio-snapshot-worker:1.0.0
    pull_policy: always
    environment:
      CHAIN_ID: "1"
      WALLETS: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045,0x742d35Cc6634C0532925a3b844Bc9e7595f0AbEb"
      OUTPUT_DIR: /data/snapshots
    volumes:
      - ./data/snapshots:/data/snapshots
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - batch

